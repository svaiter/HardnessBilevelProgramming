name = "HardnessBilevel"
defaultTargets = ["HardnessBilevel", "HardnessBilevelUnconditional"]

[leanOptions]
autoImplicit = false

# The core library: every theorem that needs a real-algebraic-geometry fact takes it as a class binder.
[[lean_lib]]
name = "HardnessBilevel"

# Proved instances of the assumption classes (from the Semialgebraic companion, built on TauCeti) and the
# assumption-free corollaries of the main theorems.
[[lean_lib]]
name = "HardnessBilevelUnconditional"

# Mathlib is pinned to the commit used by the Semialgebraic companion and by TauCeti, so that all caches hit.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

[[require]]
name = "Semialgebraic"
git = "https://github.com/svaiter/Semialgebraic"
rev = "757f29c914cc594c0dc4fa7e9d700f1cb82837b3"
